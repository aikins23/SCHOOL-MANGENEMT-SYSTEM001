name: Secret Scan

on:
  push:
    branches:
      - "**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repository-secrets:
    name: Working tree and history
    runs-on: windows-latest
    timeout-minutes: 10

    steps:
      - name: Checkout complete history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan tracked files and reachable history
        shell: pwsh
        run: .\Scripts\Scan-RepositorySecrets.ps1 -WorkingTree -History
